# Production deployment behind the Traefik gateway (external network `proxy`).
# Files next to this one on the server (/srv/apps/mp3-uploader):
#   .env     - IMAGE_TAG, written on every deploy (CI via deploy-app, or the infra playbook)
#   app.env  - application secrets, written by the infra playbook from sops
#   storage/ - generated MP3s, owned by uid 10001, survives deploys
name: mp3-uploader

x-app: &app
  image: ghcr.io/antonkuzmn1/mp3-uploader:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: app.env
  environment:
    STORAGE_DIR: /app/storage
    MP3_STORAGE_URL: https://mp3-storage.xqwke.com/
  volumes:
    - ./storage:/app/storage

services:
  telegram:
    <<: *app
    command: ["python", "-m", "src.telegram.main"]
    # Outbound only (Telegram long polling), no network besides the default one.

  # Disabled: the API has no authentication. Enable with `--profile api` once it is protected.
  api:
    <<: *app
    profiles: [api]
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mp3-uploader.rule=Host(`mp3-uploader.xqwke.com`)
      - traefik.http.services.mp3-uploader.loadbalancer.server.port=8000
      - traefik.docker.network=proxy
    networks: [default, proxy]

  storage:
    image: nginx:1.29-alpine
    restart: unless-stopped
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - ./storage:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.mp3-storage.rule=Host(`mp3-storage.xqwke.com`)
    networks: [proxy]

configs:
  nginx:
    content: |
      server {
          listen 80;
          root /usr/share/nginx/html;
          autoindex off;
          location / {
              try_files $$uri =404;
          }
      }

networks:
  proxy:
    external: true
